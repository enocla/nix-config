[bar.default]
font_family = "Nordwand Mono"
margin_edge = 0
margin_ends = 0
position = "left"
radius = 0
scale = 1.15
thickness = 36

[hooks]
wallpaper_changed = '''
wal --cols16 -i "$NOCTALIA_WALLPAPER_PATH" & matugen image "$NOCTALIA_WALLPAPER_PATH" --opacity 0.85 --source-color-index 0
'''

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@eDP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 70.0
box_width = 400.0
cx = 960.0
cy = 961.0
output = "eDP-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
input_opacity = 1.0
input_radius = 6.0
show_login_button = true

[nightlight]
enabled = true

[shell]
font_family = "SF Pro Text"

[plugins]
# gpu-screen-recorder comes from programs.gpu-screen-recorder (NixOS) and
# slurp from home.packages. Niri binds Hyper+V to a region recording toggle.
# home/programs/niri/captures.nix installs a copy patched to write .webm.
enabled = ["noctalia/screen_recorder"]

[plugin_settings."noctalia/screen_recorder"]
video_source = "region"
directory = "~/Videos"
# WebM only holds AV1/VP8/VP9; the RTX 4070 encodes AV1 in hardware.
video_codec = "av1"
# The bar widget only appears while recording; click it to stop.
hide_inactive = true

[shell.screenshot]
directory = "~/Pictures/Screenshots"
filename_pattern = "Screenshot from %Y-%m-%d %H-%M-%S"
format = "webp"
# Noctalia encodes on its main thread. Lossless WebP (quality = 100) took
# 3-4 s per 4K fullscreen capture and froze the shell; lossy is ~10x faster.
quality = 90

[notification]
filter_order = ["capture_saved", "niri_screenshot"]

# These toasts cannot carry a click action. capture-notify (captures.nix)
# sends replacements that reveal the file in Nautilus when clicked.
[notification.filter.capture_saved]
enabled = true
match = "noctalia"
match_content = "^(Screenshot|Recording) saved$"
show_toast = false
play_sound = false

# capture-window (Hyper+X) captures through niri, which always posts its own
# "Screenshot captured" toast alongside capture-notify's.
[notification.filter.niri_screenshot]
enabled = true
match = "niri"
match_content = "^Screenshot captured$"
show_toast = false
save_history = false
play_sound = false

[theme]
mode = "dark"
source = "custom"
custom_palette = "nix-config"
wallpaper_scheme = "m3-content"

[theme.templates]
enable_builtin_templates = false
builtin_ids = []

[backdrop]
# linux-wallpaperengine already draws a background layer. Noctalia's backdrop
# would map a second, blurred wallpaper above it and cover the video.
# NOTE: ~/.local/state/noctalia/settings.toml overrides this file; keep the
# backdrop disabled in Noctalia's settings UI as well.
enabled = false

[wallpaper]
# linux-wallpaperengine draws the background; Noctalia only supplies colors.
enabled = false
directory = "~/Pictures"
